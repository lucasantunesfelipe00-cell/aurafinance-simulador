<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ogBg" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#241E0D"/>
      <stop offset="50%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Metallic Gold Text Gradient -->
    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9DF"/>
      <stop offset="40%" stop-color="#F5D03A"/>
      <stop offset="75%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#996515" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Fundo Obsidiana com Brilho Dourado -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Moldura de Borda Metálica -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Emblema de Escudo AuraFinance -->
  <g transform="translate(100, 165)">
    <rect width="160" height="160" rx="36" fill="#141722" stroke="url(#goldTextGrad)" stroke-width="3"/>
    <!-- Escudo Dourado -->
    <path d="M 80 30 L 125 50 C 125 105 95 138 80 150 C 65 138 35 105 35 50 Z" fill="#996515" stroke="url(#goldTextGrad)" stroke-width="4"/>
    <!-- Estrela Central -->
    <polygon points="80,50 94,80 125,87 94,94 80,125 66,94 35,87 66,80" fill="#FFF7D6"/>
  </g>

  <!-- Título Principal -->
  <text x="300" y="230" font-family="sans-serif" font-weight="900" font-size="72" fill="url(#goldTextGrad)" letter-spacing="-1">
    AuraFinance
  </text>
  <text x="735" y="230" font-family="sans-serif" font-weight="300" font-size="72" fill="#FFFFFF" letter-spacing="2">
    ELITE
  </text>

  <!-- Subtítulo -->
  <text x="300" y="290" font-family="sans-serif" font-weight="600" font-size="32" fill="#E2E8F0">
    Simulador de Financiamento &amp; Amortização
  </text>

  <!-- Badges com Recursos -->
  <g transform="translate(300, 340)">
    <!-- Badge 1: Imóveis, Veículos & Pessoal -->
    <rect width="260" height="44" rx="22" fill="#1E2233" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>
    <text x="130" y="28" font-family="sans-serif" font-weight="700" font-size="16" fill="#D4AF37" text-anchor="middle">
      Imóveis • Veículos • Pessoal
    </text>

    <!-- Badge 2: Tabelas SAC vs PRICE -->
    <rect x="280" width="230" height="44" rx="22" fill="#1E2233" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>
    <text x="395" y="28" font-family="sans-serif" font-weight="700" font-size="16" fill="#F5D03A" text-anchor="middle">
      Tabelas SAC vs PRICE
    </text>

    <!-- Badge 3: Custo Efetivo Total -->
    <rect x="525" width="220" height="44" rx="22" fill="#1E2233" stroke="rgba(212, 175, 55, 0.4)" stroke-width="1.5"/>
    <text x="635" y="28" font-family="sans-serif" font-weight="700" font-size="16" fill="#FFF7D6" text-anchor="middle">
      Gráficos &amp; Tabelas CSV
    </text>
  </g>

  <!-- Rodapé do Card -->
  <text x="300" y="450" font-family="sans-serif" font-weight="500" font-size="20" fill="#94A3B8">
    Calcule parcelas mensais, evolução do saldo devedor e economize juros.
  </text>

  <!-- URL do site -->
  <rect x="300" y="490" width="380" height="48" rx="12" fill="url(#goldTextGrad)"/>
  <text x="490" y="522" font-family="sans-serif" font-weight="900" font-size="20" fill="#07080A" text-anchor="middle">
    aurafinance-simulador.vercel.app
  </text>
</svg>

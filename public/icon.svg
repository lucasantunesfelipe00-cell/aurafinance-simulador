<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1A150A"/>
      <stop offset="60%" stop-color="#0E1017"/>
      <stop offset="100%" stop-color="#050608"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="35%" stop-color="#F5D03A"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <!-- Dark Gold Shadow -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#2C220E"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Card Frame -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#goldLinear)" stroke-width="4" opacity="0.4"/>

  <!-- Glowing Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldLinear)" stroke-width="2" opacity="0.25" filter="url(#goldGlow)" />

  <!-- Shield Base Contour -->
  <path d="M 256 100 L 370 150 C 370 280 290 370 256 410 C 222 370 142 280 142 150 Z" 
        fill="url(#goldDark)" 
        stroke="url(#goldLinear)" 
        stroke-width="8" 
        stroke-linejoin="round"/>

  <!-- Inner Sparkle Geometric Diamond -->
  <polygon points="256,150 296,236 382,256 296,276 256,362 216,276 130,256 216,236" fill="url(#goldLinear)" />

  <!-- Center Core Star -->
  <circle cx="256" cy="256" r="28" fill="#FFF7D6" filter="url(#goldGlow)" />

  <!-- Additional Corner Sparkles -->
  <path d="M 120 120 L 125 135 L 140 140 L 125 145 L 120 160 L 115 145 L 100 140 L 115 135 Z" fill="url(#goldLinear)" opacity="0.8"/>
  <path d="M 390 110 L 394 122 L 406 126 L 394 130 L 390 142 L 386 130 L 374 126 L 386 122 Z" fill="url(#goldLinear)" opacity="0.8"/>
</svg>

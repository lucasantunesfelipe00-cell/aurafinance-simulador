name: CI - TypeCheck & Testes Automatizados

on:
  push:
    branches: [main, master, fix/*, feat/*]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: TypeCheck & Vitest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Verificação de Tipagem (TypeScript)
        run: npx tsc --noEmit

      - name: Executar Testes Unitários (Vitest)
        run: npm test
